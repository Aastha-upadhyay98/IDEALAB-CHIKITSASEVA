<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChikitsaSeva · Healthcare, Welfare & Community Support</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#102A43;--navy-2:#0B2035;--navy-3:#1A3A5C;--blue:#175CD3;--blue-h:#1149AE;--deep:#123B5D;--teal:#0F766E;--teal-bg:#E7F4F2;
  --saffron:#D97706;--bg:#F3F6FA;--surface:#FFFFFF;--surface-2:#F8FAFC;--text:#243447;--muted:#64748B;--border:#D9E2EC;
  --success:#15803D;--success-bg:#E9F6EE;--warning:#B7791F;--warning-bg:#FBF3E3;--error:#B42318;--error-bg:#FDECEA;--info-bg:#EAF1FD;
  --link:#175CD3;--focus:#D97706;--r:6px;--r-sm:4px;--side:248px;color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --blue:#3473E0;--blue-h:#4A84EA;--teal:#3BA99B;--teal-bg:#0F2D2A;--bg:#0C141E;--surface:#132030;--surface-2:#0F1A27;--text:#E2E8F0;--muted:#9AABBD;--border:#263749;
  --success:#5BC985;--success-bg:#11291C;--warning:#E3AA52;--warning-bg:#2A2010;--error:#F2847A;--error-bg:#2E1513;--info-bg:#14253B;--link:#86B4F7;color-scheme:dark}}
:root[data-theme="dark"]{
  --blue:#3473E0;--blue-h:#4A84EA;--teal:#3BA99B;--teal-bg:#0F2D2A;--bg:#0C141E;--surface:#132030;--surface-2:#0F1A27;--text:#E2E8F0;--muted:#9AABBD;--border:#263749;
  --success:#5BC985;--success-bg:#11291C;--warning:#E3AA52;--warning-bg:#2A2010;--error:#F2847A;--error-bg:#2E1513;--info-bg:#14253B;--link:#86B4F7;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:.9375rem;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
:lang(hi) body,:lang(mr) body,html:lang(hi),html:lang(mr){font-family:"Noto Sans Devanagari",Inter,"Noto Sans",system-ui,sans-serif}
a{color:var(--link);text-underline-offset:2px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5rem;color:var(--text);font-weight:650}
h1{font-size:clamp(1.5rem,2.2vw,1.875rem);letter-spacing:-.015em}
h2{font-size:1.1875rem;letter-spacing:-.01em}
h3{font-size:1rem}
h4{font-size:.875rem}
p{margin:0 0 .75rem}
ul{margin:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.wrap{max-width:1240px;margin:0 auto;padding:0 1.25rem}
.muted{color:var(--muted)}.small{font-size:.875rem}.xs{font-size:.8125rem}.num{font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.between{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between}
.stack>*+*{margin-top:1rem}
.ic{flex:none;vertical-align:middle}
.skip{position:absolute;left:1rem;top:-5rem;z-index:100;background:var(--saffron);color:#fff;padding:.5rem 1rem;border:0;border-radius:var(--r-sm);font:inherit;font-weight:600}
.skip:focus{top:calc(.5rem + env(safe-area-inset-top,0px))}

/* grid */
.g12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:1.25rem}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}.s3{grid-column:span 3}
@media (max-width:1080px){.s3{grid-column:span 6}.s4,.s5,.s7,.s8{grid-column:span 12}}
@media (max-width:640px){.s3,.s6{grid-column:span 12}}
.auto{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,var(--min,280px)),1fr))}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;padding:.5rem .95rem;border-radius:var(--r-sm);border:1px solid transparent;font:inherit;font-weight:600;font-size:.875rem;line-height:1.3;cursor:pointer;background:var(--blue);color:#fff;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--blue-h)}
.btn:active{transform:translateY(1px)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed;transform:none}
.btn.sec{background:var(--surface);color:var(--text);border-color:var(--border)}
.btn.sec:hover{border-color:var(--blue);color:var(--link);background:var(--surface)}
.btn.teal{background:var(--teal)}.btn.teal:hover{filter:brightness(.92)}
.btn.danger{background:var(--error);color:#fff}.btn.danger:hover{filter:brightness(.92)}
.btn.ghost{background:transparent;color:var(--link);padding-left:.45rem;padding-right:.45rem}
.btn.ghost:hover{background:var(--info-bg)}
.btn.sm{padding:.3rem .6rem;font-size:.8125rem}
.btn.block{width:100%}
.iconbtn{display:inline-grid;place-items:center;width:2.25rem;height:2.25rem;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;position:relative}
.iconbtn:hover{border-color:var(--blue);color:var(--link)}
.dot{position:absolute;top:-.3rem;right:-.3rem;min-width:1.15rem;height:1.15rem;padding:0 .25rem;border-radius:999px;background:var(--error);color:#fff;font-size:.6875rem;font-weight:700;display:grid;place-items:center}

/* panels */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}
.panel-h{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between;padding:.85rem 1.1rem;border-bottom:1px solid var(--border)}
.panel-h h2,.panel-h h3{margin:0;font-size:1rem}
.panel-b{padding:1rem 1.1rem}
.panel-f{padding:.7rem 1.1rem;border-top:1px solid var(--border);background:var(--surface-2);border-radius:0 0 var(--r) var(--r)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.1rem;display:flex;flex-direction:column}
.card h3 a{color:var(--text);text-decoration:none}.card h3 a:hover{color:var(--link);text-decoration:underline}
.card .foot{margin-top:auto;padding-top:.8rem;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;justify-content:space-between}
.eyebrow{font-size:.8125rem;font-weight:600;color:var(--teal)}
.reason{display:inline-flex;align-items:center;gap:.3rem;font-size:.75rem;color:var(--teal);background:var(--teal-bg);border-radius:var(--r-sm);padding:.15rem .45rem;margin:.15rem .25rem .15rem 0}

/* lists */
.list{list-style:none;margin:0;padding:0}
.list>li{display:flex;gap:.85rem;align-items:flex-start;padding:.8rem 1.1rem;border-bottom:1px solid var(--border)}
.list>li:last-child{border-bottom:0}
.list .lead{flex:none;width:2.25rem;height:2.25rem;border-radius:var(--r-sm);display:grid;place-items:center;background:var(--info-bg);color:var(--link)}
.list .lead.teal{background:var(--teal-bg);color:var(--teal)}
.list .body{flex:1;min-width:0}
.list .body a.t{font-weight:600;color:var(--text);text-decoration:none}
.list .body a.t:hover{color:var(--link);text-decoration:underline}
.list .meta{font-size:.8125rem;color:var(--muted)}
.list .side{flex:none;text-align:right}
.datebox{flex:none;width:3rem;text-align:center;border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;line-height:1.1}
.datebox b{display:block;background:var(--deep);color:#fff;font-size:.6875rem;padding:.15rem 0;font-weight:600}
.datebox span{display:block;font-size:1.125rem;font-weight:700;padding:.2rem 0;font-variant-numeric:tabular-nums}

/* badges */
.badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.75rem;font-weight:600;line-height:1.2;padding:.2rem .5rem;border-radius:var(--r-sm);border:1px solid;white-space:nowrap}
.b-success{color:var(--success);background:var(--success-bg)}
.b-warning{color:var(--warning);background:var(--warning-bg)}
.b-error{color:var(--error);background:var(--error-bg)}
.b-info{color:var(--link);background:var(--info-bg)}
.b-teal{color:var(--teal);background:var(--teal-bg)}
.b-muted{color:var(--muted);background:var(--surface-2)}

/* alerts */
.alert{border:1px solid var(--border);border-left:4px solid var(--blue);background:var(--info-bg);border-radius:var(--r);padding:.75rem 1rem;margin:0 0 1rem}
.alert.success{border-left-color:var(--success);background:var(--success-bg)}
.alert.warning{border-left-color:var(--warning);background:var(--warning-bg)}
.alert.error{border-left-color:var(--error);background:var(--error-bg)}
.alert strong{display:block;margin-bottom:.15rem}
.alert p:last-child{margin-bottom:0}

/* forms */
.field{margin-bottom:.95rem}
label,.label{display:block;font-weight:600;font-size:.8125rem;margin-bottom:.3rem}
.ctl,input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=time],input[type=search],input[type=tel],input[type=url],select,textarea{width:100%;padding:.5rem .65rem;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);color:var(--text);font:inherit;font-size:.875rem;min-height:2.4rem}
textarea{min-height:5.5rem;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
[aria-invalid="true"]{border-color:var(--error)!important;box-shadow:0 0 0 1px var(--error)}
.hint{color:var(--muted);font-size:.8125rem;margin:.25rem 0 0}
.err{color:var(--error);font-size:.8125rem;margin:.3rem 0 0;font-weight:500}
.err::before{content:"⚠ "}
.check{display:flex;gap:.55rem;align-items:flex-start;font-weight:400;font-size:.875rem;margin-bottom:.35rem}
.check input{margin-top:.2rem;width:1rem;height:1rem;flex:none;accent-color:var(--blue)}
fieldset{border:1px solid var(--border);border-radius:var(--r);padding:.8rem 1rem .6rem;margin:0 0 1rem}
legend{font-weight:600;font-size:.8125rem;padding:0 .35rem}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:0 1rem}
.fgrid .full{grid-column:1/-1}
.choice{display:grid;gap:.5rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr))}
.choice label{display:flex;gap:.6rem;align-items:flex-start;border:1px solid var(--border);border-radius:var(--r);padding:.7rem .8rem;font-weight:500;font-size:.875rem;cursor:pointer;background:var(--surface);margin:0}
.choice label:has(input:checked){border-color:var(--blue);background:var(--info-bg)}
.choice input{margin-top:.2rem;accent-color:var(--blue)}

/* segmented */
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.seg button{background:none;border:0;color:var(--text);font:inherit;font-size:.8125rem;padding:.35rem .7rem;cursor:pointer}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff;font-weight:600}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.875rem}
th,td{padding:.6rem .8rem;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
th{background:var(--surface-2);font-weight:600;color:var(--muted);font-size:.75rem;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td a{font-weight:500}

/* tabs */
.tabs{display:flex;gap:.15rem;border-bottom:1px solid var(--border);overflow-x:auto;padding:0 .5rem}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:.65rem .8rem;font:inherit;font-size:.875rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--link);border-bottom-color:var(--blue);font-weight:600}
.tabs .cnt{display:inline-block;min-width:1.25rem;padding:0 .3rem;margin-left:.3rem;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--border);font-size:.6875rem;text-align:center;font-variant-numeric:tabular-nums}

/* timeline */
.tl{list-style:none;margin:0;padding:0 0 0 .25rem}
.tl li{position:relative;padding:0 0 1rem 1.4rem;border-left:2px solid var(--border)}
.tl li:last-child{border-left-color:transparent;padding-bottom:0}
.tl li::before{content:"";position:absolute;left:-.4rem;top:.25rem;width:.7rem;height:.7rem;border-radius:50%;background:var(--surface);border:2px solid var(--blue)}
.tl li.done::before{background:var(--blue)}
.tl li.warn::before{border-color:var(--warning);background:var(--warning)}
.tl .when{font-size:.75rem;color:var(--muted)}

/* stepper */
.stepper{display:flex;list-style:none;margin:0 0 1.25rem;padding:0;gap:.5rem;counter-reset:st;flex-wrap:wrap}
.stepper li{flex:1;min-width:120px;counter-increment:st;font-size:.8125rem;color:var(--muted);border-top:3px solid var(--border);padding-top:.45rem}
.stepper li::before{content:counter(st) ". "}
.stepper li[aria-current="step"]{color:var(--link);border-top-color:var(--blue);font-weight:600}
.stepper li.done{color:var(--text);border-top-color:var(--teal)}

/* stat strip */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.strip>a,.strip>div{display:block;padding:1rem 1.1rem;text-decoration:none;color:inherit;border-right:1px solid var(--border)}
.strip>*:last-child{border-right:0}
@media (max-width:760px){.strip>*{border-right:0;border-bottom:1px solid var(--border)}}
.strip a:hover{background:var(--surface-2)}
.strip .v{font-size:1.625rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--text)}
.strip .l{font-size:.8125rem;color:var(--muted);display:flex;gap:.4rem;align-items:center;margin-bottom:.35rem}
.strip .s{font-size:.75rem;color:var(--muted);margin-top:.2rem}
.bar{height:.5rem;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--blue)}
.bar.t>span{background:var(--teal)}
.empty{text-align:center;padding:1.75rem 1rem}
.empty .em-ic{display:inline-grid;place-items:center;width:2.75rem;height:2.75rem;border-radius:50%;background:var(--info-bg);color:var(--link);margin-bottom:.5rem}
.empty p{color:var(--muted);max-width:50ch;margin:.25rem auto .9rem;font-size:.875rem}
dl.kv{display:grid;grid-template-columns:minmax(130px,max-content) 1fr;gap:.55rem 1.25rem;margin:0;font-size:.875rem}
dl.kv dt{color:var(--muted)}dl.kv dd{margin:0}
@media (max-width:560px){dl.kv{grid-template-columns:1fr;gap:.1rem}dl.kv dd{margin-bottom:.55rem}}
details.faq{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);margin-bottom:.5rem}
details.faq summary{cursor:pointer;padding:.75rem 1rem;font-weight:600}
details.faq>div{padding:0 1rem 1rem}
.ref{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:600;font-size:.8125rem}
.avatar{flex:none;display:grid;place-items:center;width:2.5rem;height:2.5rem;border-radius:var(--r-sm);font-weight:700;color:#fff;font-size:.875rem}
.crumbs{font-size:.8125rem;color:var(--muted);margin:1.1rem 0 .35rem}
.crumbs ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.35rem}
.crumbs li+li::before{content:"/";margin-right:.35rem;color:var(--border)}
.phead{display:flex;flex-wrap:wrap;gap:1rem;align-items:flex-end;justify-content:space-between;margin:.25rem 0 1.25rem}
.phead p{color:var(--muted);margin:0;max-width:70ch}

/* public header */
.site-h{background:var(--surface);border-bottom:1px solid var(--border)}
.site-h .wrap{display:flex;gap:1.25rem;align-items:center;min-height:4.5rem;padding-top:.6rem;padding-bottom:.6rem}
.brand{display:flex;gap:.7rem;align-items:center;text-decoration:none;color:var(--text);flex:none}
.brand-n{font-size:1.25rem;font-weight:700;letter-spacing:-.015em;line-height:1.1;color:var(--text)}
.brand-t{font-size:.75rem;color:var(--muted)}
.gsearch{flex:1;display:flex;max-width:520px;margin-left:auto}
.gsearch input{border-radius:var(--r-sm) 0 0 var(--r-sm)}
.gsearch button{border-radius:0 var(--r-sm) var(--r-sm) 0}
.h-actions{display:flex;gap:.5rem;align-items:center;flex:none}
.menu-btn{display:none}
@media (max-width:980px){.gsearch{display:none}.h-actions{margin-left:auto}.menu-btn{display:inline-grid}.h-actions .hide-m{display:none}}
.mainnav{background:var(--navy);color:#fff}
.mainnav>.wrap>ul{display:flex;list-style:none;margin:0;padding:0}
.mainnav li{position:relative}
.mainnav a,.mainnav button.dd{display:flex;gap:.3rem;align-items:center;white-space:nowrap;padding:.7rem .85rem;color:#E6EEF6;text-decoration:none;font:inherit;font-size:.875rem;font-weight:500;background:none;border:0;cursor:pointer}
.mainnav a:hover,.mainnav button.dd:hover{background:rgba(255,255,255,.08);color:#fff}
.mainnav [aria-current="page"]{color:#fff;box-shadow:inset 0 -3px 0 #5B9BF0;background:rgba(255,255,255,.06)}
.ddm{position:absolute;top:100%;left:0;z-index:30;min-width:290px;background:var(--surface);border:1px solid var(--border);border-radius:0 0 var(--r) var(--r);box-shadow:0 10px 24px rgba(16,42,67,.16);padding:.4rem;display:none}
.ddm.open{display:block}
.ddm a{color:var(--text)!important;display:flex;gap:.65rem;align-items:flex-start;padding:.6rem .65rem;border-radius:var(--r-sm);white-space:normal}
.ddm a:hover{background:var(--info-bg)!important}
.ddm a .ic{color:var(--link);margin-top:.1rem}
.ddm a small{display:block;color:var(--muted);font-weight:400;font-size:.75rem}
@media (max-width:980px){.mainnav{display:none}}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(8,20,33,.5);z-index:70}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(320px,86vw);background:var(--navy);color:#fff;z-index:71;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 1rem) 1rem calc(env(safe-area-inset-bottom,0px) + 1rem)}
.drawer a{display:flex;gap:.6rem;align-items:center;color:#E6EEF6;text-decoration:none;padding:.6rem .5rem;border-radius:var(--r-sm)}
.drawer a:hover,.drawer a[aria-current="page"]{background:rgba(255,255,255,.1);color:#fff}
.drawer h2{color:#9FB3C8;font-size:.75rem;font-weight:600;margin:1rem .5rem .3rem}

/* hero / discovery */
.disc{background:var(--deep);color:#fff;padding:2.25rem 0 2rem;border-bottom:4px solid var(--teal)}
.disc h1{color:#fff;font-size:clamp(1.6rem,3vw,2.1rem);margin-bottom:.35rem}
.disc p.lead{color:#C9D9EA;max-width:62ch;margin-bottom:1.1rem}
.disc-form{background:var(--surface);color:var(--text);border-radius:var(--r);padding:.9rem;display:grid;grid-template-columns:2fr 1.2fr 1.2fr auto;gap:.75rem;align-items:end}
.disc-form .field{margin:0}
.disc-form.five{grid-template-columns:2fr 1.2fr 1.2fr 1fr auto}
@media (max-width:1100px){.disc-form.five{grid-template-columns:1fr 1fr}}
@media (max-width:860px){.disc-form,.disc-form.five{grid-template-columns:1fr}}
.gsearch button,.topbar form button{min-height:2.4rem}
.quick{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}
.quick a{display:inline-flex;gap:.45rem;align-items:center;padding:.45rem .75rem;border:1px solid rgba(255,255,255,.28);border-radius:var(--r-sm);color:#fff;text-decoration:none;font-size:.8125rem;font-weight:500;background:rgba(255,255,255,.05)}
.quick a:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.5)}
section.blk{margin-top:2.25rem}
.sh{display:flex;flex-wrap:wrap;gap:.5rem;align-items:flex-end;justify-content:space-between;margin-bottom:.9rem}
.sh h2{margin:0;font-size:1.25rem}
.sh p{margin:.2rem 0 0;color:var(--muted);font-size:.875rem}
.svc-dir{display:grid;grid-template-columns:repeat(3,1fr)}
.svc-dir>div{padding:1rem 1.1rem;border-right:1px solid var(--border)}
.svc-dir>div:last-child{border-right:0}
@media (max-width:860px){.svc-dir{grid-template-columns:1fr}.svc-dir>div{border-right:0;border-bottom:1px solid var(--border)}}
.svc-dir h3{font-size:.8125rem;color:var(--muted);font-weight:600;margin-bottom:.4rem}
.svc-dir a{display:flex;gap:.7rem;padding:.55rem .4rem;margin:0 -.4rem;border-radius:var(--r-sm);text-decoration:none;color:var(--text)}
.svc-dir a:hover{background:var(--info-bg)}
.svc-dir a .ic{color:var(--link);margin-top:.15rem}
.svc-dir a b{display:block;font-size:.9rem;font-weight:600}
.svc-dir a small{display:block;color:var(--muted);font-size:.8125rem}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);counter-reset:s}
.steps4 li{list-style:none;counter-increment:s;padding:1rem 1.1rem;border-right:1px solid var(--border)}
.steps4 li:last-child{border-right:0}
.steps4 li::before{content:counter(s);display:grid;place-items:center;width:1.75rem;height:1.75rem;border-radius:var(--r-sm);background:var(--navy);color:#fff;font-weight:700;font-size:.8125rem;margin-bottom:.5rem}
@media (max-width:860px){.steps4{grid-template-columns:1fr 1fr}.steps4 li{border-bottom:1px solid var(--border)}}
@media (max-width:520px){.steps4{grid-template-columns:1fr}}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:1.25rem;align-items:start}
.layout.r{grid-template-columns:minmax(0,1fr) 330px}
@media (max-width:960px){.layout,.layout.r{grid-template-columns:1fr}}

/* footer */
.site-f{background:var(--navy);color:#B7C7D8;font-size:.875rem;margin-top:3rem}
.site-f .wrap{padding-top:2rem;padding-bottom:1.25rem}
.site-f h2{color:#fff;font-size:.875rem;margin-bottom:.6rem}
.site-f ul{list-style:none;margin:0;padding:0;display:grid;gap:.35rem}
.site-f a{color:#DCE6F0}
.fgrid5{display:grid;gap:1.5rem;grid-template-columns:1.5fr repeat(4,1fr)}
@media (max-width:900px){.fgrid5{grid-template-columns:1fr 1fr}}
.fbot{border-top:1px solid rgba(255,255,255,.14);margin-top:1.5rem;padding-top:1rem;display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;justify-content:space-between;font-size:.8125rem}
.demo{background:var(--warning-bg);border-bottom:1px solid var(--border);font-size:.8125rem}
.demo .wrap{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center;justify-content:space-between;padding-top:.4rem;padding-bottom:.4rem}

/* app shell */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.app.collapsed{--side:68px}
.app > .side{background:var(--navy);color:#C9D7E5;position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);overflow:hidden}
.side-brand{display:flex;gap:.6rem;align-items:center;padding:.9rem .95rem;border-bottom:1px solid rgba(255,255,255,.08);text-decoration:none;color:#fff;min-height:3.75rem}
.side-brand b{font-size:1.0625rem;letter-spacing:-.01em}
.side-brand small{display:block;font-size:.6875rem;color:#8FA6BE;font-weight:500}
.side-nav{flex:1;overflow-y:auto;padding:.5rem .55rem;scrollbar-width:thin}
.side-nav h3{font-size:.6875rem;font-weight:600;color:#7F97B0;margin:.9rem .55rem .3rem;white-space:nowrap}
.side-nav a{display:flex;gap:.7rem;align-items:center;padding:.5rem .6rem;border-radius:var(--r-sm);color:#D2DEEA;text-decoration:none;font-size:.875rem;white-space:nowrap;position:relative}
.side-nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.side-nav a[aria-current="page"]{background:#1E4A75;color:#fff;font-weight:600;box-shadow:inset 3px 0 0 #5B9BF0}
.side-nav .cnt{margin-left:auto;background:#C2410C;color:#fff;border-radius:var(--r-sm);font-size:.6875rem;font-weight:700;padding:0 .35rem;font-variant-numeric:tabular-nums}
.side-foot{border-top:1px solid rgba(255,255,255,.08);padding:.7rem .75rem calc(.7rem + env(safe-area-inset-bottom,0px))}
.side-foot .lbl{font-size:.6875rem;color:#7F97B0;margin:0 0 .3rem;font-weight:600}
.app > .side .seg{background:transparent;border-color:rgba(255,255,255,.2);width:100%}
.app > .side .seg button{color:#D2DEEA;flex:1;padding:.35rem .25rem}
.app > .side .seg button+button{border-left-color:rgba(255,255,255,.2)}
.app > .side .seg button[aria-pressed="true"]{background:#2F6FDB;color:#fff}
.side-btn{display:flex;gap:.6rem;align-items:center;width:100%;background:none;border:0;color:#D2DEEA;font:inherit;font-size:.8125rem;padding:.45rem .35rem;border-radius:var(--r-sm);cursor:pointer;text-align:left;text-decoration:none}
.side-btn:hover{background:rgba(255,255,255,.07);color:#fff}
.side-user{display:flex;gap:.6rem;align-items:center;margin-top:.5rem;padding-top:.6rem;border-top:1px solid rgba(255,255,255,.08)}
.side-user b{display:block;color:#fff;font-size:.8125rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-user small{display:block;color:#8FA6BE;font-size:.6875rem}
.app.collapsed .hide-c{display:none!important}
.app.collapsed .side-nav a,.app.collapsed .side-btn{justify-content:center}
.app.collapsed .side-nav .cnt{position:absolute;top:.15rem;right:.15rem;margin:0}
.app-main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--border);display:flex;gap:.75rem;align-items:center;padding:.6rem 1.25rem;min-height:3.75rem}
.topbar .tt{min-width:0}
.topbar .tt b{display:block;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .tt small{color:var(--muted);font-size:.75rem}
.topbar form{margin-left:auto;flex:0 1 340px;display:flex}
.topbar form input{border-radius:var(--r-sm) 0 0 var(--r-sm)}
.topbar form button{border-radius:0 var(--r-sm) var(--r-sm) 0;padding:.45rem .65rem}
.app-content{padding:1.25rem;max-width:1320px;width:100%}
.app-content main:focus{outline:none}
.mob-only{display:none}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .app > .side{position:fixed;left:0;top:0;bottom:0;width:272px;z-index:71;transform:translateX(-100%);transition:transform .2s}
  .app.nav-open > .side{transform:none}
  .app.collapsed{--side:248px}.app.collapsed .hide-c{display:revert!important}
  .mob-only{display:inline-grid}.desk-only{display:none!important}
  .topbar form{display:none}
  .app-content{padding:1rem}
}
.pop{position:absolute;right:0;top:calc(100% + .4rem);z-index:40;width:min(360px,92vw);background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 12px 28px rgba(16,42,67,.18)}
.pop .list>li{padding:.65rem .9rem}
.pop-menu a,.pop-menu button{display:flex;gap:.6rem;align-items:center;width:100%;padding:.55rem .9rem;color:var(--text);text-decoration:none;background:none;border:0;font:inherit;font-size:.875rem;cursor:pointer;text-align:left}
.pop-menu a:hover,.pop-menu button:hover{background:var(--info-bg)}
.rel{position:relative}
.greet{display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between;align-items:flex-end;margin-bottom:1.1rem}
.greet h1{margin:0}
.greet p{margin:.2rem 0 0;color:var(--muted)}
.qa{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:.5rem}
.qa a{display:flex;flex-direction:column;gap:.35rem;padding:.75rem;border:1px solid var(--border);border-radius:var(--r);text-decoration:none;color:var(--text);font-size:.8125rem;font-weight:600;background:var(--surface)}
.qa a:hover{border-color:var(--blue);background:var(--info-bg)}
.qa a .ic{color:var(--link)}

/* a11y fab */
.fab{position:fixed;left:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:45;display:inline-flex;gap:.45rem;align-items:center;padding:.55rem .85rem;border-radius:var(--r);border:0;background:var(--navy);color:#fff;font:inherit;font-size:.8125rem;font-weight:600;cursor:pointer;box-shadow:0 6px 18px rgba(16,42,67,.3)}
.fab:hover{background:var(--navy-3)}
.fab-panel{position:fixed;left:1rem;bottom:calc(4rem + env(safe-area-inset-bottom,0px));z-index:46;width:min(320px,calc(100vw - 2rem));background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 12px 32px rgba(16,42,67,.25);padding:1rem}
.fab-panel h2{font-size:.9375rem}
.fab-panel .grp{margin-bottom:.9rem}
.fab-panel .seg{width:100%}.fab-panel .seg button{flex:1}

/* modal & toast */
.modal-back{position:fixed;inset:0;background:rgba(8,20,33,.55);display:grid;place-items:center;padding:1rem;z-index:80}
.modal{background:var(--surface);color:var(--text);border-radius:var(--r);max-width:620px;width:100%;max-height:calc(100vh - 2rem - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;padding:1.3rem 1.4rem;border:1px solid var(--border);box-shadow:0 16px 40px rgba(0,0,0,.28)}
.modal.wide{max-width:820px}
.m-actions{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:flex-end;margin-top:1.1rem;padding-top:.9rem;border-top:1px solid var(--border)}
.toasts{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:90;display:grid;gap:.5rem;max-width:min(92vw,380px)}
.toast{background:var(--surface);color:var(--text);border:1px solid var(--border);border-left:4px solid var(--blue);border-radius:var(--r);padding:.65rem .9rem;box-shadow:0 6px 18px rgba(0,0,0,.15);font-size:.875rem}
.toast.success{border-left-color:var(--success)}.toast.error{border-left-color:var(--error)}.toast.warning{border-left-color:var(--warning)}
.loading{display:flex;gap:.6rem;align-items:center;color:var(--muted);padding:3rem 1.25rem}
.spinner{width:1.1rem;height:1.1rem;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>

nitiative. It brings together healthcare camps, providers, NGOs, welfare scheme information, volunteering and community support in one place.":["चिकित्सासेवा एक स्वतंत्र जनसेवा पहल है। यह स्वास्थ्य शिविर, सेवा प्रदाता, एनजीओ, कल्याण योजनाओं की जानकारी, स्वयंसेवा और सामुदायिक सहायता को एक जगह लाती है।","चिकित्सासेवा हा एक स्वतंत्र लोकसेवा उपक्रम आहे. आरोग्य शिबिरे, सेवा पुरवठादार, स्वयंसेवी संस्था, कल्याणकारी योजनांची माहिती, स्वयंसेवा आणि सामुदायिक मदत एकाच ठिकाणी आणतो."],"ChikitsaSeva is finding a suitable organization.":["चिकित्सासेवा एक उपयुक्त संगठन खोज रही है।","चिकित्सासेवा योग्य संस्था शोधत आहे."],"ChikitsaSeva is not a financial institution and does not collect money. Donations go directly to the organization through its official channel. Links are shown only after the destination is verified.":["चिकित्सासेवा कोई वित्तीय संस्था नहीं है और पैसे नहीं लेती। दान सीधे संगठन के आधिकारिक माध्यम से जाता है। लिंक केवल गंतव्य के सत्यापन के बाद दिखाए जाते हैं।","चिकित्सासेवा ही वित्तीय संस्था नाही आणि पैसे स्वीकारत नाही. देणगी थेट संस्थेच्या अधिकृत माध्यमातून जाते. गंतव्याची पडताळणी झाल्यावरच लिंक दाखवल्या जातात."],"ChikitsaSeva is reviewing your request to find a suitable organization.":["चिकित्सासेवा उपयुक्त संगठन खोजने के लिए आपके अनुरोध की समीक्षा कर रही है।","योग्य संस्था शोधण्यासाठी चिकित्सासेवा तुमची विनंती तपासत आहे."],"ChikitsaSeva provides information and coordination tools. It does not provide medical advice, decide scheme eligibility or guarantee any benefit.":["चिकित्सासेवा जानकारी और समन्वय के साधन देती है। यह चिकित्सीय सलाह नहीं देती, योजना पात्रता तय नहीं करती और किसी लाभ की गारंटी नहीं देती।","चिकित्सासेवा माहिती आणि समन्वयाची साधने पुरवते. ती वैद्यकीय सल्ला देत नाही, योजनेची पात्रता ठरवत नाही किंवा कोणत्याही लाभाची हमी देत नाही."],"ChikitsaSeva will find a suitable organization":["चिकित्सासेवा उपयुक्त संगठन खोजेगी","चिकित्सासेवा योग्य संस्था शोधेल"],"Child welfare":["बाल कल्याण","बालकल्याण"],"Childline – help for children in distress":["चाइल्डलाइन – स .1 स्तर AA है: कीबोर्ड से संचालन, दिखाई देने वाला फ़ोकस, अक्षर आकार बदलना, हल्की और गहरी थीम, और स्थिति रंग के साथ शब्दों में भी।","आमचे ध्येय WCAG 2.1 स्तर AA आहे: कीबोर्डने वापर, दिसणारा फोकस, अक्षरांचा आकार बदलणे, फिकट व गडद रंगसंगती आणि स्थिती रंगासोबत शब्दांतही."],"We collect only what is needed to provide each service. Organizations see only the details you choose to share for a specific request. You can review and withdraw consent from your portal.":["हम प्रत्येक सेवा के लिए केवल आवश्यक जानकारी लेते हैं। संगठन केवल वही विवरण देखते हैं जो आप किसी अनुरोध के लिए साझा करना चुनते हैं। आप अपने पोर्टल से सहमति देख और वापस ले सकते हैं।","आम्ही प्रत्येक सेवेसाठी आवश्यक तेवढीच माहिती घेतो. संस्थांना तुम्ही एखाद्या विनंतीसाठी दिलेलीच माहिती दिसते. तुम्ही तुमच्या पोर्टलमधून संमती पाहू आणि मागे घेऊ शकता."],"We never ask for Aadhaar or other ID numbers, or medical records, to create an account.":["खाता बनाने के लिए हम कभी आधार या अन्य पहचान संख्या, या मेडिकल रिकॉर्ड नहीं माँगते।","खाते तयार करण्यासाठी आम्ही कधीही आधार किंवा इतर ओळख क्रमांक, किंवा वैद्यकीय नोंदी मागत नाही."],"We store your name, contact details, optional profile details, registrations, requests and consent choices. We do not store ID numbers or medical records.":["हम आपका नाम, संपर्क विवरण, वैकल्पिक प्रोफ़ाइल विवरण, पंजीकरण, अनुरोध और सहमति विकल्प रखते हैं। हम पहचान संख्या या मेडिकल रिकॉर्ड नहीं रखते।","आम्ही तुमचे नाव, संपर्क तपशील, ऐच्छिक प्रोफाइल माहिती, नोंदण्या, विनंत्या आणि संमतीच्या निवडी ठेवतो. आम्ही ओळख क्रमांक किंवा वैद्यकीय नोंदी ठेवत नाही."],"We use your district, age and interests to suggest services. Turning this off does not stop you from browsing everything.":["हम सेवाएँ सुझाने के लिए आपके ज़िले, आयु और रुचियों का उपयोग करते हैं। इसे बंद करने पर भी आप सब कुछ देख सकते हैं।","सेवा सुचवण्यासाठी आम्ही तुमचा जिल्हा, वय आणि आवडी वापरतो. हे बंद केले तरी तुम्ही सर्व काही पाहू शकता."],"Website":["वेबसाइट","संकेतस्थळ"],"Weekday evenings":["सप्ताह के दिनों में शाम","आठवड्याच्या दिवशी संध्याकाळी"],"Week function campState(c){
  if(c.status==='cancelled')return'cancelled';if(c.status==='draft')return'draft';
  if(pd(c.date)<TODAY)return'completed';if(pd(c.regOpen)>TODAY)return'soon';if(pd(c.deadline)<TODAY)return'closed';
  if(c.capacity&&seatsTaken(c.id)>=c.capacity)return'full';return'open';
}

function ageOk(p,c){if(p.age==null||p.age==='')return true;if(c.minAge!=null&&p.age<c.minAge)return false;if(c.maxAge!=null&&p.age>c.maxAge)return false;return true}
function validateRegistration(z,c){
  if(!z)return t('Please log in to register.');if(!z.verified)return t('Verify your account before registering for a camp.');
  const st=campState(c);
  if(st==='draft'||st==='cancelled')return t('This camp is not accepting registrations because it has been cancelled.');
  if(st==='completed')return t('This camp has already taken place.');
  if(st==='soon')return t('Registration opens on {d}.',{d:fmtD(c.regOpen)});
  if(st==='closed')return t('The registration deadline ({d}) has passed.',{d:fmtD(c.deadline)});
  if(st==='full')return t('All slots for this camp are booked.');
  if(state.regs.some(r=>r.campId===c.id&&r.citizenId===z.id&&['confirmed','pending'].includes(r.status)))return t('You already have an active registration for this camp.');
  if((c.minAge!=null||c.maxAge!=null)&&(z.age==null||z.age===''))return t('This camp has an age requirement. Add your age to your profile, then try again.');
  if(!ageOk(z,c))return t('Your profile age does not meet this camp’s age requirement.');
  return null;
}
function serverRegister(cid,campId){
  const z=citizenById(cid),c=campById(campId);if(!c)return{ok:false,error:t('This camp could not be found.')};

  const r={ref:mkRef(state),campId,citizenId:cid,status:'confirmed',createdAt:off(0),updatedAt:off(0)};state.regs.push(r);
  notify(cid,'Your registration for the {camp} is confirmed. Reference {ref}.',{camp:c.title,ref:r.ref});
  log(z.name+' (citizen)','Registered for camp',`${c.title} (${c.id}), ref ${r.ref}`);return{ok:true,reg:r};
}

/* ---------- explainable matching ---------- */
function matches(z,opts={}){
  const out=[];const prof=Object.assign({},z,opts.member?{age:opts.member.age}:{});
  const city=(prof.district||prof.city||'').toLowerCase(),st=prof.state;
  const near=(c,s)=>city&&String(c).toLowerCase()===city?'Available in your selected district.':(st&&s===st?'Available in your state.':null);
  state.camps.forEach(c=>{const s=campState(c);if(!['open','soon'].includes(s))return;if(!ageOk(prof,c))return;
    const why=[];const n=near(c.city,c.state);if(n)why.push(n);if((z.interests||[]).includes(c.category))why.push('Matches your selected healthcare interests.');
    if(c.minAge!=null&&prof.age!=null&&prof.age>=c.minAge&&c.minAge>=30)why.push('This service may be relevant to your age group.');
    if(s==='open')why.push('Registration is currently open.');
    if(why.length<2||(!n&&!(z.interests||[]).includes(c.category)))return;
    if(state.regs.some(r=>r.campId===c.id&&r.citizenId===z.id&&r.status==='confirmed'))return;
    out.push({kind:'camp',id:c.id,score:why.length+(n?2:0),why,date:c.date})});
  state.programs.forEach(p=>{if(p.status==='closed')return;const o=orgById(p.orgId);if(!o||['suspended','expired'].includes(o.verification))return;
    const why=[];const n=near(p.city,o.state);if(n)why.push(n);if((z.supportInterests||[]).includes(p.type))why.push('Matches your selected support needs.');
    if(p.type==='Senior citizen care'&&prof.age>=60)why.push('This service may be relevant to your age group.');
    if(!n||why.length<2)return;out.push({kind:'prog',id:p.id,score:why.length+1,why})});
  state.schemes.filter(s=>s.status==='active').forEach(s=>{const why=[];const ak=prof.age!=null;const inR=ak&&(s.minAge==null||prof.age>=s.minAge)&&(s.maxAge==null||prof.age<=s.maxAge);
    if(ak&&!inR)return;const i=(s.interests||[]).find(x=>(z.interests||[]).includes(x));if(i)why.push('Matches your selected healthcare interests.');
    if(ak&&s.minAge!=null&&s.minAge>=60&&inR)why.push('This service may be relevant to your age group.');
    if(s.id==='pmjay'&&ak&&prof.age>=70)why.push('This service may be relevant to your age group.');
    if(s.openToAll&&!why.length)why.push('Open to all citizens. Check official eligibility.');
    if(!why.length)return;out.push({kind:'scheme',id:s.id,score:why.length,why})});
  if(z.volunteer){state.opps.forEach(v=>{if(daysUntil(v.deadline)<0)return;const why=[];const n=near(v.city,orgById(v.orgId).state);if(n)why.push(n);
    if(v.skills.some(sk=>(z.volunteer.skills||[]).some(x=>sk.toLowerCase().includes(x.toLowerCase()))))why.push('Matches your volunteer skills.');
    if(!why.length)return;out.push({kind:'opp',id:v.id,score:why.length,why})})}
  return out.sort((a,b)=>b.score-a.score);
}
function itemInfo(kind,id){

  if(kind==='prog'){const p=progById(id);const o=p&&orgById(p.orgId);return p&&{title:t(p.title),sub:`${o.name} · ${t(p.city)}`,href:'org-'+p.orgId,icon:'users',type:t('NGO programme')}}
  if(kind==='scheme'){const s=schemeById(id);return s&&{title:s.name,sub:t(s.category),href:'scheme-'+id,icon:'doc',type:t('Government scheme')}}
  if(kind==='org'){const o=orgById(id);return o&&{title:o.name,sub:`${t(o.type)} · ${t(o.city)}`,href:'org-'+id,icon:o.kind==='ngo'?'users':'hospital',type:o.kind==='ngo'?t('Organization'):t('Healthcare provider')}}

  return null;
}

function setErrors(form,errs){
  $$('.err',form).forEach(e=>{e.hidden=true;e.textContent=''});$$('[aria-invalid]',form).forEach(e=>e.removeAttribute('aria-invalid'));
  const keys=Object.keys(errs);
  keys.forEach(k=>{const e=$('#err-'+k,form);const i=form.querySelector(`[name="${k}"]`);if(e){e.hidden=false;e.textContent=errs[k]}if(i){i.setAttribute('aria-invalid','true');i.setAttribute('aria-errormessage','err-'+k)}});
  if(keys.length){const i=form.querySelector(`[name="${keys[0]}"]`);if(i)i.focus();announce(errs[keys[0]])}
  return!keys.length;
}

function searchResults(q,loc,cat){
  q=(q||'').trim().toLowerCase();const has=s=>!q||s.toLowerCase().includes(q);const inLoc=c=>!loc||c===loc;
  const R={};
  if(!cat||cat==='camps')R.camps=state.camps.filter(c=>isPublic(c)&&c.status!=='cancelled'&&campState(c)!=='completed'&&inLoc(c.city)&&has([c.title,t(c.title),c.category,c.short,c.services.join(' ')].join(' ')));
  if(!cat||cat==='providers')R.providers=publicOrgs().filter(o=>o.kind==='provider'&&inLoc(o.city)&&has([o.name,o.type,o.about,o.categories.join(' '),o.services.join(' ')].join(' ')));
  if(!cat||cat==='ngos'){R.ngos=publicOrgs().filter(o=>o.kind==='ngo'&&inLoc(o.city)&&has([o.name,o.about,o.categories.join(' '),o.services.join(' ')].join(' ')));R.progs=state.programs.filter(p=>p.status!=='closed'&&inLoc(p.city)&&has([p.title,t(p.title),p.type,p.desc].join(' ')))}
  if(!cat||cat==='schemes')R.schemes=state.schemes.filter(s=>s.status==='active'&&has([s.name,s.category,s.desc,s.beneficiaries].join(' ')));
  if(!cat||cat==='volunteer')R.opps=state.opps.filter(v=>daysUntil(v.deadline)>=0&&inLoc(v.city)&&has([v.title,t(v.title),v.activity,v.resp].join(' ')));
  return R;
}

function filterCamps(){
  const f=state.campF,z=me();
  const list=state.camps.filter(isPublic).filter(x=>{const st=campState(x);
    if(f.status==='upcoming'&&!['open','soon','closed','full'].includes(st))return false;if(f.status==='open'&&st!=='open')return false;
    if(f.status==='closed'&&!['closed','full'].includes(st))return false;if(f.status==='completed'&&st!=='completed')return false;if(f.status==='cancelled'&&st!=='cancelled')return false;
    if(f.cat&&x.category!==f.cat)return false;if(f.q&&![x.title,t(x.title),x.category,x.short,x.services.join(' ')].join(' ').toLowerCase().includes(f.q.toLowerCase()))return false;
    if(f.loc&&x.city!==f.loc)return false;if(f.from&&pd(x.date)<pd(f.from))return false;if(f.free&&x.fee!=='Free')return false;if(f.access&&!x.access)return false;return true});
  const lr=x=>{const c=(f.loc||(z&&z.district)||'').toLowerCase();return(c&&x.city.toLowerCase()===c?2:0)+(z&&z.state===x.state?1:0)};
  const so={date:(a,b)=>pd(a.date)-pd(b.date),recent:(a,b)=>(b.publishedAt||'').localeCompare(a.publishedAt||''),location:(a,b)=>lr(b)-lr(a)||pd(a.date)-pd(b.date),availability:(a,b)=>(seatsLeft(b)??9999)-(seatsLeft(a)??9999)};
  return list.sort(so[f.sort]||so.date);
}

const noticeText=n=>{const p=Object.assign({},n.p);if(p.camp)p.camp=t(p.camp);if(p.status)p.status=t(p.status);if(p.opp)p.opp=t(p.opp);return t(n.k,p)};

const forName=(z,r)=>r.memberId?(memberById(z,r.memberId)||{name:t('Family member')}).name:t('Myself');
function upcomingItems(z){
  const it=[];
  state.regs.filter(r=>r.citizenId===z.id&&r.status==='confirmed').forEach(r=>{const c=campById(r.campId);if(c&&daysUntil(c.date)>=0&&c.status!=='cancelled')it.push({date:c.date,title:t(c.title),meta:`${c.venue}, ${t(c.city)} · ${fmtT(c.start)}`,href:'camp-'+c.id,tag:t('Camp registration')})});
  state.appts.filter(a=>a.citizenId===z.id&&['requested','confirmed'].includes(a.status)&&daysUntil(a.date)>=0).forEach(a=>it.push({date:a.date,title:a.type==='callback'?t('Callback request'):t('Appointment request'),meta:`${orgById(a.orgId).name} · ${t(a.slot)}`,href:'c-apps',tag:t(AP_B[a.status][0]),warn:a.status==='requested'}));

}

    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        state.geo = { lat, lon, active: true, accuracy: Math.round(pos.coords.accuracy) };
        const CITY_MAP = {
          'Pune': [18.5204, 73.8567],
          'Mumbai': [19.0760, 72.8777],
          'Nagpur': [21.1458, 79.0882],
          'Nashik': [19.9975, 73.7898],

          'Delhi': [28.6139, 77.2090],
          'Bengaluru': [12.9716, 77.5946],
          'Hyderabad': [17.3850, 78.4867],
          'Ahmedabad': [23.0225, 72.5714]
        };
        let closest = 'Pune', minD = Infinity;
        for (const [c, [clat, clon]] of Object.entries(CITY_MAP)) {
          const d = Math.hypot(lat - clat, lon - clon);
          if (d < minD) { minD = d; closest = c; }
        }
        state.geo.city = closest;
        state.geo.display = `${closest}, India`;
        state.search.loc = closest;
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
          if (res.ok) {
            const data = await res.json();
            const town = data.address.city || data.address.town || data.address.suburb || data.address.county || closest;
            state.geo.display = `${town}, ${data.address.state || 'India'}`;
          }
        } catch(e) {}
        toast(`Real-time location: ${state.geo.display} (${lat.toFixed(3)}°N, ${lon.toFixed(3)}°E)`, 'success');
        rerenderKeep();
      },
      (err) => {
        toast(`Location access: ${err.message}. Showing Pune region.`, 'warning');
        state.geo = { lat: 18.5204, lon: 73.8567, active: true, city: 'Pune', display: 'Pune, Maharashtra' };
        state.search.loc = 'Pune';

      },
      { timeout: 8000, enableHighAccuracy: true }

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!e.target.closest('.ddm,.pop,[data-act="dd"],[data-act="notifPop"],[data-act="profilePop"]'))closePops();
  if(fabOpen&&!e.target.closest('.fab,.fab-panel')){fabOpen=false;$('#fab-root').innerHTML=fabHtml(false)}
  if(!b){const a=e.target.closest('a[href^="#"]');if(a&&$('#app-shell.nav-open'))ACT.navClose();if(a&&$('.drawer'))ACT.closeDrawer();return}
  if(b.dataset.act==='modalBack'){if(e.target===b)closeModal();return}
  if(b.dataset.act==='togglePersonalize'){ACT.togglePersonalize(null,b);return}
  if(b.disabled)return;
  if(b.getAttribute('aria-disabled')==='true'){e.preventDefault();const r=$('#reg-reason');if(r)toast(r.textContent.trim(),'warning');return}
  e.preventDefault();const f=ACT[b.dataset.act];if(f)f(b.dataset.arg,b,e);
});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(f){e.preventDefault();const h=FORM[f.dataset.form];if(h)h(f,e.submitter)}});
document.addEventListener('input',e=>{const el=e.target.closest('[data-filter]');if(el&&!['checkbox','radio'].includes(el.type)&&el.tagName!=='SELECT')FILTER[el.dataset.filter](el)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-filter]');if(el&&(['checkbox','radio'].includes(el.type)||el.tagName==='SELECT'))FILTER[el.dataset.filter](el)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#modal-root').innerHTML){closeModal();return}if($('.drawer')){ACT.closeDrawer();return}if($('#app-shell.nav-open')){ACT.navClose();return}if(fabOpen){fabOpen=false;$('#fab-root').innerHTML=fabHtml(false);$('.fab').focus();return}closePops()}
  if(e.key==='Tab'&&$('.modal')){const fs=$$('.modal a[href],.modal button:not([disabled]),.modal input:not([disabled]),.modal select,.modal textarea').filter(x=>x.offsetParent!==null);if(!fs.length)return;const a=fs[0],z=fs[fs.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
});

  grvClose(id){const g=state.grievances.find(x=>x.id===id);g.status='closed';g.history.push({at:off(0),status:'closed',note:'Closed.'});log(actor(),'Closed grievance',id);rerenderKeep()},
  annForm(id){const a=id?state.announcements.find(x=>x.id===id):{title:'',body:'',kind:'service',audience:'All India',expires:off(30),status:'draft'};
    openModal(`<h2>${id?'Edit announcement':'New announcement'}</h2><form data-form="ann" data-arg="${id||''}" novalidate><div class="fgrid">${fld('title','Title',inp('title',a.title),'','full')}${fld('body','Message',ta('body',a.body,'rows="4"'),'Keep it short and practical.','full')}${fld('kind','Type',sel('kind',[['service','Service update'],['health','Health advisory']],a.kind,'',null))}${fld('audience','Audience',sel('audience',['All India',...STATES],a.audience,'',null))}${fld('expires','Show until',inp('expires',a.expires,'date'))}</div><div class="m-actions"><button class="btn sec" type="button" data-act="close">Discard</button><button class="btn sec" type="submit" name="intent" value="draft">Save as draft</button><button class="btn" type="submit" name="intent" value="published">Publish</button></div></form>`,{wide:true,label:'Announcement'})},
  annToggle(id){const a=state.announcements.find(x=>x.id===id);a.status=a.status==='published'?'draft':'published';if(a.status==='published')a.published=off(0);log(actor(),a.status==='published'?'Published announcement':'Unpublished announcement',a.title);rerenderKeep()}
});
Object.assign(FORM,{
  offer(f){const d=Object.fromEntries(new FormData(f));const e={};if(d.item.trim().length<3)e.item=t('Describe the item.');if(!d.category)e.category=t('Choose the type of equipment.');if(!d.condition)e.condition=t('Choose the condition.');if(!(Number(d.qty)>=1))e.qty=t('Enter a quantity.');if(!d.area)e.area=t('Choose a collection area.');if(!f.querySelector('[name=consent]').checked)e.consent=t('Your contact details are needed so the organization can collect the item.');if(!setErrors(f,e))return;
    const id='EQ-'+(400+state.offers.length+1);state.offers.push({id,citizenId:me().id,item:d.item.trim(),category:d.category,condition:d.condition,qty:Number(d.qty),area:d.area,notes:d.notes.trim(),status:'available',orgId:null,createdAt:off(0)});log(actor(),'Listed equipment offer',id);closeModal();toast(t('Offer {id} listed. You will be notified when an organization claims it.',{id}),'success');if(location.hash!=='#c-resources')go('c-resources');else rerenderKeep()},
  rate(f){const d=Object.fromEntries(new FormData(f));if(!setErrors(f,d.rating?{}:{rating:t('Choose a rating.')}))return;const[kind,ref]=f.dataset.arg.split('|');const r=kind==='request'?reqById(ref):null;
    state.feedback.push({id:'FB-'+(state.feedback.length+1),citizenId:me().id,kind,refId:ref,orgId:r?r.orgId:(campById(ref)||{}).orgId||null,rating:Number(d.rating),comment:(d.comment||'').trim(),at:off(0)});log(actor(),'Rated service',`${kind} ${ref}: ${d.rating}/5`);closeModal();toast(t('Thank you for your feedback.'),'success');rerenderKeep()},
  grv(f){const d=Object.fromEntries(new FormData(f));const e={};if(!d.category)e.category=t('Choose what it is about.');if(d.desc.trim().length<15)e.desc=t('Describe what happened in a little more detail.');if(!f.querySelector('[name=consent]').checked)e.consent=t('Agree so we can look into your concern.');if(!setErrors(f,e))return;
    const id='GR-'+(500+state.grievances.length+1);state.grievances.push({id,citizenId:me().id,category:d.category,orgId:d.orgId||null,desc:d.desc.trim(),status:'open',response:'',createdAt:off(0),history:[{at:off(0),status:'open',note:'Grievance submitted.'}]});notify(me().id,'Your concern {id} was received. We will reply here.',{id});log(actor(),'Raised grievance',id);closeModal();toast(t('Concern {id} submitted.',{id}),'success');rerenderKeep()},
  grvRespond(f){const v=(new FormData(f).get('response')||'').trim();if(!setErrors(f,v.length>10?{}:{response:'Write a response for the citizen.'}))return;const g=state.grievances.find(x=>x.id===f.dataset.arg);g.status='resolved';g.response=v;g.history.push({at:off(0),status:'resolved',note:'Response sent.'});notify(g.citizenId,'Your concern {id} has a response.',{id:g.id});log(actor(),'Responded to grievance',g.id);closeModal();toast('Response sent.','success');rerenderKeep()},
  drive(f){const d=Object.fromEntries(new FormData(f));const e={};if(!d.title.trim())e.title='Required.';if(!d.date||daysUntil(d.date)<1)e.date='Choose a future date.';if(!d.venue.trim())e.venue='Required.';if(!f.querySelector('[name=licensed]').checked)e.licensed='Drives must be run with a licensed blood bank.';if(!setErrors(f,e))return;
    state.drives.push({id:'BD-'+(state.drives.length+1),orgId:myOrg().id,title:d.title.trim(),city:d.city.trim(),venue:d.venue.trim(),date:d.date,start:d.start,end:d.end,interested:[]});log(actor(),'Published blood donation drive',d.title);closeModal();toast('Drive published.','success');rerenderKeep()},
  ann(f,sub){const d=Object.fromEntries(new FormData(f));const e={};if(!d.title.trim())e.title='Enter a title.';if(d.body.trim().length<10)e.body='Write the message.';if(!d.expires||daysUntil(d.expires)<0)e.expires='Choose a date from today onwards.';if(!setErrors(f,e))return;const st=sub&&sub.value||'draft';
    const data={title:d.title.trim(),body:d.body.trim(),kind:d.kind,audience:d.audience,expires:d.expires,status:st};if(f.dataset.arg){const a=state.announcements.find(x=>x.id===f.dataset.arg);if(st==='published'&&a.status!=='published')data.published=off(0);Object.assign(a,data)}else state.announcements.push(Object.assign({id:'AN-'+(state.announcements.length+1),published:off(0)},data));log(actor(),st==='published'?'Published announcement':'Saved announcement draft',data.title);closeModal();toast(st==='published'?'Announcement published.':'Draft saved.','success');rerenderKeep()}
});
